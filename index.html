<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Text to Azure Blob Storage</title>
    <!-- Reliable CDN bundle for Azure Storage Blob SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/storage-blob@12.17.0/dist/browser/azure-storage-blob.js"></script>
</head>
<body>

    <h2>Save Note to Azure Blob Storage</h2>
    <textarea id="userText" rows="6" cols="50" placeholder="Type your text here..."></textarea><br>
    <button id="uploadBtn">Upload to Azure</button>
    <p id="status" style="font-weight: bold;"></p>

<script>
    // REPLACE THESE VALUES WITH YOUR ACTUAL AZURE DETAILS
    const accountName = "mytextstorageapp";
    // Use a SAS Token (Shared Access Signature) generated from your Azure Portal
    const sasToken = "sp=rwl&st=2026-08-01T03:25:00Z&se=2026-08-06T11:40:00Z&spr=https&sv=2026-02-06&sr=c&sig=6Jx1WIhXBETKiPS7yg%2FFPWh14qJXX9dTlFtw%2F7g%2B49s%3D";
    const containerName = "notes-container";

    document.getElementById("uploadBtn").addEventListener("click", async () => {
        const statusEl = document.getElementById("status");
        const textContent = document.getElementById("userText").value;

        if (!textContent.trim()) {
            statusEl.style.color = "red";
            statusEl.innerText = "Please enter some text first.";
            return;
        }

        statusEl.style.color = "black";
        statusEl.innerText = "Uploading...";

        try {
            // Check if the azure SDK loaded properly into window namespace
            if (typeof azblob === 'undefined') {
                throw new Error("Azure SDK failed to load into the browser.");
            }

            // 1. Create the ContainerClient using the SAS URL
            const containerUrl = `https://${accountName}.blob.core.windows.net/${containerName}?${sasToken}`;
            const containerClient = new azblob.ContainerClient(containerUrl);

            // 2. Define a unique file name using a timestamp
            const blobName = `note_${Date.now()}.txt`;
            const blockBlobClient = containerClient.getBlockBlobClient(blobName);

            // 3. Convert text to a browser Blob and upload
            const blobData = new Blob([textContent], { type: "text/plain;charset=utf-8" });

            // uploadBrowserData is optimized for browser usage
            await blockBlobClient.uploadBrowserData(blobData);

            statusEl.style.color = "green";
            statusEl.innerText = `Success! Saved as ${blobName}`;
        } catch (error) {
            console.error(error);
            statusEl.style.color = "red";
            statusEl.innerText = "Upload failed. Check console for details.";
        }
    });
</script>

</body>
</html>
