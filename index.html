<!DOCTYPE html>  
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Cranes System LLC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            text-align: center;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        .enter-btn-corner {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: #000000;
            color: #000000;
            border: none;
            width: 8px;
            height: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-family: monospace;
            cursor: pointer;
            outline: none;
            border-radius: 4px;
            transition: all 0.2s;
            z-index: 1000;
        }

        #appPage {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #ffffff;
            color: #2b2b2b;
            text-align: left;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            border: none;
            outline: none;
        }
        
        .top-bar { 
            background: #f0f0f0; 
            border: none; 
            outline: none; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 4px 10px; 
            font-size: 13px; 
            user-select: none; 
        }

        .container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 10px 10px 2px 10px; 
            box-sizing: border-box; 
            max-width: 100%; 
            width: 100%; 
            border: none; 
            outline: none; 
        }

        textarea.editor-box { 
            flex: 1; 
            font-family: monospace; 
            padding: 10px; 
            font-size: 14px; 
            border: none; 
            border-radius: 0; 
            box-sizing: border-box; 
            resize: none; 
            width: 100%; 
            white-space: pre; 
            overflow-wrap: normal; 
            overflow-x: auto; 
            outline: none; 
        }

        .bottom-bar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 10px 6px 10px; 
            background: #ffffff; 
            border: none; 
            outline: none; 
        }

        .back-home-link { 
            font-size: 11px; 
            color: #0078d4; 
            cursor: pointer; 
            text-decoration: underline; 
            border: none; 
            outline: none; 
        }
    </style>
</head>
<body>

<div id="landingPage">
    <div class="domain-header">ACE CRANES SYSTEM LLC</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>LAUNCHING SOON</h1>
        </div>
    </div>
   
    <div class="lower-section">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>
        <p style="color: #888888; font-size: 0.9rem; margin: 0;">Our official website is under construction.</p>
    </div>

    <button class="enter-btn-corner" onclick="openAppPage()">o</button>
</div>

<div id="appPage">
    <div class="top-bar">
        <span class="back-home-link" onclick="openLandingPage()">← Back</span>
    </div>

    <div class="container">
        <textarea id="codeContent" class="editor-box" placeholder="Type your static notes or text here..."></textarea>
    </div>

    <div class="bottom-bar">
        <span style="font-size: 10px; color: #777;">Local Static App Mode</span>
    </div>
</div>

<script>
    function openAppPage() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'flex';
    }

    function openLandingPage() {
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }
</script>

</body>
</html>
