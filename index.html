<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Text to Azure Blob Storage</title>
</head>
<body>

    <h2>Save Note to Azure Blob Storage</h2>
    <textarea id="userText" rows="6" cols="50" placeholder="Type your text here..."></textarea><br>
    <button id="uploadBtn">Upload to Azure</button>
    <p id="status" style="font-weight: bold;"></p>

<script>
    // REPLACE THESE VALUES WITH YOUR ACTUAL AZURE DETAILS
    const accountName = "mytextstorageapp";
    const sasToken = "sp=rwl&st=2026-08-01T03:25:00Z&se=2026-08-06T11:40:00Z&spr=https&sv=2026-02-06&sr=c&sig=6Jx1WIhXBETKiPS7yg%2FFPWh14qJXX9dTlFtw%2F7g%2B49s%3D";
    const containerName = "notes-container";

    document.getElementById("uploadBtn").addEventListener("click", async () => {
        const statusEl = document.getElementById("status");
        const textContent = document.getElementById("userText").value;

        if (!textContent.trim()) {
            statusEl.style.color = "red";
            statusEl.innerText = "Please enter some text first.";
            return;
        }

        statusEl.style.color = "black";
        statusEl.innerText = "Uploading...";

        try {
            const blobName = `note_${Date.now()}.txt`;
            // Direct REST API URL for Azure Blob Storage block blob upload
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: textContent
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Azure Error: ${response.status} - ${errText}`);
            }

            statusEl.style.color = "green";
            statusEl.innerText = `Success! Saved as ${blobName}`;
        } catch (error) {
            console.error(error);
            statusEl.style.color = "red";
            statusEl.innerText = "Upload failed. Check console for details.";
        }
    });
</script>

</body>
</html>
