<!DOCTYPE html>    
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        #landingPage {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .domain-header {
            padding: 30px 20px 20px 20px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            background: transparent;
            text-align: center;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            min-height: 350px;
            background: url('https://img1.wsimg.com/parking/images/backgrounds/bg-default.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-title-box {
            background-color: rgba(0, 85, 220, 0.85);
            padding: 15px 40px;
        }

        .hero-title-box h1 {
            margin: 0;
            font-size: 2.8rem;
            font-family: Georgia, serif;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .lower-section {
            background-color: #000000;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 50px;
            position: relative;
            padding-bottom: 50px;
        }

        .lower-section h2 {
            font-family: Georgia, serif;
            font-size: 2rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .contact-divider {
            width: 40px;
            height: 1px;
            background-color: #444444;
            margin-bottom: 25px;
        }

        .contact-form-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
            text-align: left;
        }

        .form-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            background-color: #000000;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 14px 16px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            border-radius: 0;
        }

        .form-control:focus {
            border-color: #ffffff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #cccccc;
            user-select: none;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #ffffff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .send-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #dddddd;
        }

        .form-footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #777777;
            text-align: center;
            width: 100%;
        }

        #formStatus {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #4CAF50;
        }

        .enter-btn-corner {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: #000000;
            color: #000000;
            border: 1px solid #1a1a1a;
            width: 8px;
            height: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-family: monospace;
            cursor: pointer;
            outline: none;
            border-radius: 4px;
            text-transform: lowercase;
            transition: all 0.2s;
            z-index: 1000;
        }
        .enter-btn-corner:hover {
            background: #000000;
            color: #000000;
            border-color: #333333;
        }

        #appPage {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #ffffff;
            color: #2b2b2b;
            text-align: left;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        .top-bar { background: #f0f0f0; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; font-size: 13px; user-select: none; }
        .crypto-bar { display: flex; gap: 5px; align-items: center; }
        .crypto-bar input { padding: 2px 6px; font-size: 11px; border: 1px solid #ccc; width: 120px; }
        .crypto-bar button { padding: 2px 6px; font-size: 11px; cursor: pointer; background: #fff; border: 1px solid #ccc; }

        .container { flex: 1; display: flex; flex-direction: column; padding: 10px 10px 2px 10px; box-sizing: border-box; max-width: 100%; width: 100%; }
        textarea.editor-box { flex: 1; font-family: monospace; padding: 10px; font-size: 14px; border: 1px solid #e0e0e0; border-radius: 0; box-sizing: border-box; resize: none; width: 100%; white-space: pre; overflow-wrap: normal; overflow-x: auto; outline: none; }
        textarea.editor-box:focus { border-color: #b0b0b0; }

        .bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px 10px; background: #ffffff; }
        .action-buttons { display: flex; align-items: center; gap: 4px; }
        button.tool-btn, label.tool-btn {
            background: #FFFFFF;
            color: #FFFFFF;
            border: 1px solid #d0d0d0;
            outline: none;
            padding: 0px 2px;
            font-size: 3px;    
            font-family: sans-serif;
            font-weight: normal;
            cursor: pointer;
            margin-left: 1px;    
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button.tool-btn:hover, label.tool-btn:hover {
            background: #FFFFFF;
            border-color: #adadad;
        }
        #status { color: #666; font-size: 10px; margin-right: 6px; }
        .back-home-link { font-size: 11px; color: #0078d4; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div id="landingPage">
    <div class="domain-header">ACE CRANES SYSTEM LLC</div>
    <div class="hero-section">
        <div class="hero-title-box">
            <h1>LAUNCHING SOON</h1>
        </div>
    </div>
   
    <div class="lower-section" id="lowerSection">
        <h2>Contact Us</h2>
        <div class="contact-divider"></div>
    </div>

    <div class="contact-form-container" id="contactFormContainer">
        <h2 style="font-family: Georgia, serif; font-size: 2rem; font-weight: normal; margin: 0 0 10px 0; color: #ffffff; text-align: center; width: 100%;">Drop us a line!</h2>
        <div class="contact-divider" style="margin: 0 auto 25px auto;"></div>
       
        <div class="form-group">
            <input type="text" id="dummyName" class="form-control" placeholder="Name">
        </div>
        <div class="form-group">
            <input type="email" id="dummyEmail" class="form-control" placeholder="Email*">
        </div>
        <div class="form-group">
            <textarea id="msgContent" class="form-control" placeholder="Message"></textarea>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="emailListCheck">
            <label for="emailListCheck">Sign up for our email list for updates, promotions, and more.</label>
        </div>
        <div style="text-align: center; width: 100%;">
            <button class="send-btn" onclick="submitMessageToCloud()">Send</button>
            <div id="formStatus"></div>
        </div>
        <div class="form-footer-note">
            This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply.
        </div>
    </div>

    <button class="enter-btn-corner" onclick="openAppPage()">o</button>
</div>

<div id="appPage">
    <div class="top-bar">
        <span class="back-home-link" onclick="openLandingPage()">←</span>
        <div class="crypto-bar" style="visibility: hidden;">
            <input type="password" id="secretPass" placeholder="Encryption Key">
            <button onclick="encryptText()">Lock</button>
            <button onclick="decryptText()">Unlock</button>
        </div>
    </div>

    <div class="container">
        <textarea id="codeContent" class="editor-box" placeholder="."></textarea>
    </div>

    <div class="bottom-bar">
        <span class="back-home-link" onclick="openLandingPage()">← </span>
        <div class="action-buttons">
            <span id="status"></span>
            
            <!-- Folder Upload Button & Input -->
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;" onchange="uploadFolderToCloud(event)">
            <label for="folderInput" class="tool-btn" title="Upload Folder">f</label>

            <!-- Zip Upload Button & Input -->
            <input type="file" id="zipInput" accept=".zip" style="display: none;" onchange="uploadZipToCloud(event)">
            <label for="zipInput" class="tool-btn" title="Upload Zip File">z</label>

            <button class="tool-btn" onclick="loadFromCloud()">l</button>
            <button class="tool-btn" onclick="saveToCloud()">s</button>
        </div>
    </div>
</div>

<script>
    const baseUrl = "https://aceinventory.net";
    const accountName = "mytextstorageapp";
    const sasToken = "sp=rwl&st=2026-08-01T03:25:00Z&se=2026-08-06T11:40:00Z&spr=https&sv=2026-02-06&sr=c&sig=6Jx1WIhXBETKiPS7yg%2FFPWh14qJXX9dTlFtw%2F7g%2B49s%3D";
    const containerName = "notes-container";

    function openAppPage() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('appPage').style.display = 'flex';
    }

    function openLandingPage() {
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function encryptText() {
        const text = document.getElementById('codeContent').value;
        const pass = document.getElementById('secretPass').value;
        if (!pass) { alert("Enter an encryption key!"); return; }
        
        let encrypted = "";
        for (let i = 0; i < text.length; i++) {
            const charCode = text.charCodeAt(i) ^ pass.charCodeAt(i % pass.length);
            encrypted += String.fromCharCode(charCode);
        }
        document.getElementById('codeContent').value = btoa(encodeURIComponent(encrypted));
        document.getElementById('status').innerText = "Locked!";
        setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
    }

    function decryptText() {
        try {
            const encoded = document.getElementById('codeContent').value;
            const pass = document.getElementById('secretPass').value;
            if (!pass) { alert("Enter the encryption key!"); return; }

            const text = decodeURIComponent(atob(encoded));
            let decrypted = "";
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i) ^ pass.charCodeAt(i % pass.length);
                decrypted += String.fromCharCode(charCode);
            }
            document.getElementById('codeContent').value = decrypted;
            document.getElementById('status').innerText = "Unlocked!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        } catch (e) {
            alert("Decryption failed. Check your key or text.");
        }
    }

    async function submitMessageToCloud() {
        const nameVal = document.getElementById('dummyName').value;
        const emailVal = document.getElementById('dummyEmail').value;
        const msgVal = document.getElementById('msgContent').value;
        const statusEl = document.getElementById('formStatus');

        if (!msgVal.trim()) {
            statusEl.style.color = '#ff6b6b';
            statusEl.innerText = "Please enter a message.";
            return;
        }

        statusEl.style.color = '#cccccc';
        statusEl.innerText = "Sending...";

        const newSubmission = `Name: ${nameVal}\nEmail: ${emailVal}\nMessage:\n${msgVal}`;
        const blobName = `message_${Date.now()}.txt`;
        const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
        const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

        try {
            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: newSubmission
            });

            if (!response.ok) throw new Error("Azure Error");

            statusEl.style.color = '#4CAF50';
            statusEl.innerText = "Message sent successfully!";
            document.getElementById('dummyName').value = '';
            document.getElementById('dummyEmail').value = '';
            document.getElementById('msgContent').value = '';
            document.getElementById('emailListCheck').checked = false;
            setTimeout(() => { statusEl.innerText = ""; }, 3000);
        } catch (error) {
            statusEl.style.color = '#ff6b6b';
            statusEl.innerText = "Error sending message!";
        }
    }

    async function loadFromCloud() {
        document.getElementById('status').innerText = "Loading...";
        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const listUrl = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list${cleanSas.replace('?', '&')}`;

            const listRes = await fetch(listUrl);
            if (!listRes.ok) throw new Error("Failed to list blobs");
            const textData = await listRes.text();
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textData, "text/xml");
            const blobs = xmlDoc.getElementsByTagName("Blob");

            if (blobs.length === 0) {
                document.getElementById('codeContent').value = "No files found.";
                document.getElementById('status').innerText = "Loaded!";
                setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
                return;
            }

            let validBlobs = [];
            for (let i = 0; i < blobs.length; i++) {
                const bName = blobs[i].getElementsByTagName("Name")[0].textContent;
                if (!bName.startsWith('.private_folder_') && !bName.startsWith('.private_zip_')) {
                    validBlobs.push(bName);
                }
            }

            if (validBlobs.length === 0) {
                document.getElementById('codeContent').value = "No public files found.";
                document.getElementById('status').innerText = "Loaded!";
                setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
                return;
            }

            const latestBlobName = validBlobs[validBlobs.length - 1];
            const blobUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${latestBlobName}${cleanSas}`;

            const blobRes = await fetch(blobUrl);
            const content = await blobRes.text();

            document.getElementById('codeContent').value = content;
            document.getElementById('status').innerText = "Loaded!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        } catch (error) {
            document.getElementById('status').innerText = "Error!";
        }
    }

    async function saveToCloud() {
        const newText = document.getElementById('codeContent').value;
        document.getElementById('status').innerText = "Saving...";

        try {
            const blobName = `note_${Date.now()}.txt`;
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: newText
            });

            if (!response.ok) throw new Error("Azure Error");

            document.getElementById('status').innerText = "Saved!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
        } catch (error) {
            document.getElementById('status').innerText = "Error!";
        }
    }

    async function uploadFolderToCloud(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        document.getElementById('status').innerText = "Uploading Folder...";

        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const timestamp = Date.now();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const relativePath = file.webkitRelativePath || file.name;
                const blobName = `.private_folder_${timestamp}/${relativePath}`;
                const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

                const response = await fetch(uploadUrl, {
                    method: "PUT",
                    headers: {
                        "x-ms-blob-type": "BlockBlob",
                        "Content-Type": file.type || "application/octet-stream"
                    },
                    body: file
                });

                if (!response.ok) {
                    throw new Error(`Failed to upload ${relativePath}`);
                }
            }

            document.getElementById('status').innerText = "Folder Uploaded!";
            setTimeout(() => { 
                document.getElementById('status').innerText = ""; 
                event.target.value = ''; 
            }, 3000);
        } catch (error) {
            console.log(error);
            document.getElementById('status').innerText = "Error Uploading!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    }

    async function uploadZipToCloud(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('status').innerText = "Uploading Zip...";

        try {
            const cleanSas = sasToken.startsWith('?') ? sasToken : '?' + sasToken;
            const timestamp = Date.now();
            const blobName = `.private_zip_${timestamp}/${file.name}`;
            const uploadUrl = `https://${accountName}.blob.core.windows.net/${containerName}/${blobName}${cleanSas}`;

            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "x-ms-blob-type": "BlockBlob",
                    "Content-Type": "application/zip"
                },
                body: file
            });

            if (!response.ok) throw new Error("Azure Upload Error");

            document.getElementById('status').innerText = "Zip Uploaded!";
            setTimeout(() => { 
                document.getElementById('status').innerText = ""; 
                event.target.value = ''; 
            }, 3000);
        } catch (error) {
            console.log(error);
            document.getElementById('status').innerText = "Error Uploading Zip!";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    }
</script>

</body>
</html>
